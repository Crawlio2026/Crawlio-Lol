<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Crawlio Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #030408;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e9edf2;
      position: relative;
      overflow: hidden;
    }

    /* GIF background — fully visible */
    .bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* Faint vignette */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 100%);
    }

    /* Floating stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 6px 1px rgba(180, 210, 255, 0.9), 0 0 12px 2px rgba(120, 170, 255, 0.5);
      animation: floatStar linear infinite;
    }

    @keyframes floatStar {
      0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
      12%  { opacity: 0.95; }
      50%  { opacity: 0.55; transform: translateY(-55vh) translateX(18px) scale(1); }
      88%  { opacity: 0.75; }
      100% { transform: translateY(-110vh) translateX(-12px) scale(0.5); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 3;
      max-width: 720px;
      width: 100%;
      background: rgba(10, 13, 19, 0.42);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 3.5rem 3rem;
      text-align: center;
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.85);
    }

    /* Brand pill */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2.5rem;
      padding: 0.5rem 1.4rem 0.5rem 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.55);
    }

    .brand-name {
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    /* Big 404 */
    .error-code {
      font-size: clamp(6rem, 22vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.9;
      margin-bottom: 0.5rem;
      background: linear-gradient(150deg, #ffffff 10%, #d6e4ff 55%, #8ff5e6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 4px 30px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 50px rgba(110, 180, 255, 0.3));
    }

    /* Divider */
    .divider {
      width: 70px;
      height: 3px;
      margin: 1.5rem auto 1.8rem;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #3b82f6, #2dd4bf, transparent);
      opacity: 0.9;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.6);
    }

    /* Heading */
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.8rem;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.7);
    }

    /* Description */
    .description {
      font-size: 1.08rem;
      line-height: 1.7;
      color: #e2e9f3;
      max-width: 30rem;
      margin: 0 auto 2.2rem;
      font-weight: 400;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7);
    }

    /* Button */
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.9rem 2rem;
      border-radius: 100px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      box-shadow:
        0 10px 30px -8px rgba(59, 130, 246, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 40px -8px rgba(59, 130, 246, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      filter: brightness(1.08);
    }

    .home-btn:active {
      transform: translateY(0);
    }

    .home-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .home-btn:hover svg {
      transform: translateX(-3px);
    }

    @media (max-width: 600px) {
      .card {
        padding: 2.8rem 1.6rem;
        border-radius: 22px;
      }
      .title {
        font-size: 1.3rem;
      }
      .description {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <img class="bg-gif" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExOGFmbDIyZWp5Y3ZobTdwZXJ2amZsMWFiaDBvbHdpcHZvOHJ2NnBlYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/GK7dGndK4kyOozR9Xk/giphy.gif" alt="" aria-hidden="true">
  <div class="bg-overlay"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="card">
    <div class="brand">
      <img class="logo-img" src="https://cdn.phototourl.com/member/2026-10-20-015227a9-132b-4048-8342-16c05ea6816d.jpg" alt="Crawlio Network logo">
      <span class="brand-name">Crawlio Network</span>
    </div>

    <h1 class="error-code">404</h1>
    <div class="divider"></div>

    <h2 class="title">Page not found</h2>
    <p class="description">
      The page you're looking for doesn't exist or has been moved.
      Let's get you back on track.
    </p>

    <a class="home-btn" href="https://crawlio.xyz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
      Back to crawlio.xyz
    </a>
  </main>

  <script>
    (function() {
      const starsContainer = document.getElementById('stars');
      const STAR_COUNT = 38;
      for (let i = 0; i < STAR_COUNT; i++) {
        const star = document.createElement('span');
        star.classList.add('star');
        const size = (Math.random() * 2.5 + 1).toFixed(2) + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.left = (Math.random() * 100).toFixed(2) + '%';
        star.style.top = (Math.random() * 110).toFixed(2) + '%';
        star.style.animationDuration = (Math.random() * 13 + 10).toFixed(1) + 's';
        star.style.animationDelay = (Math.random() * 16).toFixed(1) + 's';
        star.style.opacity = (Math.random() * 0.4 + 0.6).toFixed(2);
        starsContainer.appendChild(star);
      }
    })();
  </script>
</body>
</html>
