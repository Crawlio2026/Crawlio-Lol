<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawlio Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0d0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e9edf2;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 30% 20%, rgba(64, 128, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 200, 150, 0.08) 0%, transparent 55%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 900px;
      width: 100%;
      background: rgba(18, 22, 28, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 48px;
      padding: 3rem 2.5rem;
      box-shadow: 
        0 30px 50px -20px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 0 40px rgba(70, 130, 255, 0.06);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .crawlio-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .globe-dot {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    .crawlio-text {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      background: linear-gradient(120deg, #ffffff, #b9d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .domain-section {
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 2rem;
    }

    .domain-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8f9bb3;
      margin-bottom: 0.6rem;
    }

    .domain-name {
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(145deg, #ffffff 20%, #a0b8e0 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .domain-tld {
      background: linear-gradient(135deg, #3b82f6, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 1rem;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 60px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #6ee7b7;
    }

    .status-pill .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 12px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .owner-message {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .message-text {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #d0d9e6;
      max-width: 85%;
      font-weight: 400;
      border-left: 3px solid #3b82f6;
      padding-left: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .message-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    .contact-block {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 36px;
      padding: 1.2rem 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contact-icon {
      font-size: 1.3rem;
      opacity: 0.8;
    }

    .contact-detail {
      display: flex;
      flex-direction: column;
    }

    .contact-detail .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8f9bb3;
    }

    .contact-detail .value {
      font-weight: 500;
      color: #e9edf2;
      font-size: 1rem;
    }

    .contact-detail .value a {
      color: #6ea8ff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-detail .value a:hover {
      color: #a0c4ff;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 32px;
      }
      .message-text {
        max-width: 100%;
        font-size: 1.05rem;
      }
      .contact-block {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-row">
      <div class="crawlio-mark">
        <div class="globe-dot">C</div>
        <span class="crawlio-text">Crawlio Network</span>
      </div>
    </div>

    <div class="domain-section">
      <div class="domain-label">This domain is owned by</div>
      <div class="domain-name">crawlio<span class="domain-tld">.xyz</span></div>
      <div class="status-pill">
        <span class="dot"></span>
        Verified owner
      </div>
    </div>

    <div class="owner-message">
      <p class="message-text">
        This domain is owned and operated by <strong>Crawlio Network</strong>.
        Visit us at our main site for more information.
      </p>

      <div class="contact-block">
        <div class="contact-item">
          <span class="contact-icon">🌐</span>
          <div class="contact-detail">
            <span class="label">Website</span>
            <span class="value"><a href="https://crawlio.xyz" target="_blank" rel="noopener">crawlio.xyz</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
